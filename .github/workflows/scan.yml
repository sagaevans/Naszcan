name: Scan koin KOL

on:
  schedule:
    - cron: "0 */3 * * *"   # tiap 3 jam (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jalankan scanner
        env:
          RPC_URL: ${{ secrets.RPC_URL }}   # opsional (mis. Helius). Kosong = publicnode
          HOURS: "12"
          MAX_WALLETS: "100"
          MAX_TX_PER_WALLET: "500"
        run: node scanner/scan.mjs
      - name: Simpan hasil
        run: |
          git config user.name "naszcan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
