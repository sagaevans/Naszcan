name: Scan koin KOL

on:
  schedule:
    - cron: "5 0,12 * * *"   # 2x sehari (07.05 & 19.05 WIB): hanya perbarui daftar wallet
  workflow_dispatch:
    inputs:
      full:
        description: "Scan penuh (bukan hanya daftar wallet)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jalankan scanner
        env:
          RPC_URL: ${{ secrets.RPC_URL }}   # opsional (mis. Helius). Kosong = publicnode
          HOURS: "1"
          WALLETS_ONLY: ${{ github.event_name == 'schedule' || inputs.full != true }}
          MAX_WALLETS: "100"
          MAX_TX_PER_WALLET: "500"
        run: node scanner/scan.mjs
      - name: Simpan hasil
        run: |
          git config user.name "naszcan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
